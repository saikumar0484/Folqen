version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: folqen_postgres
    environment:
      POSTGRES_USER: folqen
      POSTGRES_PASSWORD: folqen_password
      POSTGRES_DB: folqen_db
    ports:
      - '5432:5432'
    volumes:
      - folqen_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U folqen -d folqen_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  folqen_postgres_data:
    driver: local
